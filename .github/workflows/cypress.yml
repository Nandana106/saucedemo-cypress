name: Cypress Tests and Report

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ==========================================
  # PARALLEL CYPRESS TEST EXECUTION
  # ==========================================
  cypress:

    name: Cypress - ${{ matrix.name }}

    runs-on: ubuntu-latest

    timeout-minutes: 15

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: authentication
            spec: cypress/e2e/authentication/**/*.cy.js

          - name: products
            spec: cypress/e2e/products/**/*.cy.js

          - name: cart
            spec: cypress/e2e/cart/**/*.cy.js

          - name: checkout
            spec: cypress/e2e/checkout/**/*.cy.js

          - name: footer
            spec: cypress/e2e/footer/**/*.cy.js
          
          - name: sidebar
            spec: "cypress/e2e/sidebar/**/*.cy.js"

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run Cypress tests
      - name: Run Cypress Tests
        continue-on-error: true
        run: npx cypress run \
            --browser chrome \
            --spec "${{ matrix.spec }}"
        env:
          CYPRESS_password: ${{ secrets.CYPRESS_PASSWORD }}

      # 5. Upload Mochawesome JSON
      - name: Upload Mochawesome JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-${{ matrix.name }}
          path: cypress/reports/.jsons/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      # 6. Upload Cypress screenshots
      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.name }}
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 30

      # 7. Upload Cypress videos
      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ matrix.name }}
          path: cypress/videos/
          if-no-files-found: ignore
          retention-days: 30


  # ==========================================
  # MERGE AND PUBLISH REPORT
  # ==========================================
  report:

    name: Generate Mochawesome Report

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs: cypress

    if: always()

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Download all Mochawesome reports
      - name: Download all Mochawesome reports
        uses: actions/download-artifact@v4
        with:
          pattern: mochawesome-*
          path: cypress/reports/jsons

      # 5. Merge Mochawesome JSON
      - name: Merge Mochawesome JSON
        run: |
          npx mochawesome-merge \
            "cypress/reports/jsons/**/mochawesome.json" \
            -o cypress/reports/mochawesome.json
          
          # Verify merged report was created
          if [ ! -f cypress/reports/mochawesome.json ]; then
            echo "❌ Error: Merged report file not created!"
            exit 1
          fi
          
          echo "✅ Report merge completed successfully"
          ls -lh cypress/reports/mochawesome.json

      # 6. Generate HTML report
      - name: Generate HTML report
        run: |
          npx marge \
            cypress/reports/mochawesome.json \
            -f index \
            -o cypress/reports/html

      # 7. Check Test Results & Generate Summary
      - name: Check Test Results & Generate Summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const reportPath = 'cypress/reports/mochawesome.json';
            
            // Check if report file exists
            if (!fs.existsSync(reportPath)) {
              const errorMsg = '## ❌ Test Report Error\n\nReport file not found at ' + reportPath + '. No tests may have run.';
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, errorMsg);
              console.error('❌ Report file missing:', reportPath);
              process.exit(1);
            }
            
            try {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const stats = report.stats;
              
              // Validate stats object
              if (!stats || !stats.tests || stats.passes === undefined || stats.failures === undefined) {
                throw new Error('Invalid report format: missing required stats properties');
              }

              const summary = \`
          ## 📊 Test Results Summary
          
          | Metric | Count |
          |--------|-------|
          | ✅ Passed | \${stats.passes} |
          | ❌ Failed | \${stats.failures} |
          | ⏭️ Skipped | \${stats.skipped} |
          | 📈 Total | \${stats.tests} |
          | ⏱️ Duration | \${(stats.duration / 1000).toFixed(2)}s |
          | 📊 Pass Rate | \${((stats.passes / stats.tests) * 100).toFixed(2)}% |
          \`;
              
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
              
              if (stats.failures > 0) {
                console.error(\`❌ \${stats.failures} test(s) failed!\`);
                process.exit(1);
              }
            } catch (error) {
              const errorMsg = '## ❌ Error Processing Report\n\n' + error.message;
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, errorMsg);
              console.error('❌ Error:', error.message);
              process.exit(1);
            }
          "

      # 8. Setup GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # 9. Upload report to GitHub Pages
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: cypress/reports/html

      # 10. Deploy report to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
