name: Cypress Tests and Report

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ==========================================
  # PARALLEL CYPRESS TEST EXECUTION
  # ==========================================
  cypress:

    name: Cypress - ${{ matrix.name }}

    runs-on: ubuntu-latest

    timeout-minutes: 15

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: authentication
            spec: cypress/e2e/authentication/**/*.cy.js

          - name: products
            spec: cypress/e2e/products/**/*.cy.js

          - name: cart
            spec: cypress/e2e/cart/**/*.cy.js

          - name: checkout
            spec: cypress/e2e/checkout/**/*.cy.js

          - name: footer
            spec: cypress/e2e/footer/**/*.cy.js
          
          - name: sidebar
            spec: "cypress/e2e/sidebar/**/*.cy.js"

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Debug - List directory contents
      - name: Debug - Check workspace
        run: |
          echo "Current directory:"
          pwd
          echo "Directory contents:"
          ls -la
          echo "Checking for package.json:"
          find . -name "package.json" -type f

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install

      # 5. Run Cypress tests
      - name: Run Cypress Tests
        continue-on-error: true
        run: npx cypress run \
            --browser chrome \
            --spec "${{ matrix.spec }}"
        env:
          CYPRESS_password: ${{ secrets.CYPRESS_PASSWORD }}
  
      # 6. Rename report file with matrix name
      - name: Rename report file
        if: always()
        run: |
          if [ -f cypress/reports/.jsons/mochawesome.json ]; then
            mv cypress/reports/.jsons/mochawesome.json cypress/reports/.jsons/mochawesome-${{ matrix.name }}.json
            echo "✅ Renamed: mochawesome-${{ matrix.name }}.json"
          fi

      # 7. Upload Mochawesome JSON
      - name: Upload Mochawesome JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-${{ matrix.name }}
          path: cypress/reports/.jsons/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      # 8. Upload Cypress screenshots
      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.name }}
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 30

      # 9. Upload Cypress videos
      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ matrix.name }}
          path: cypress/videos/
          if-no-files-found: ignore
          retention-days: 30


  # ==========================================
  # MERGE AND PUBLISH REPORT
  # ==========================================
  report:

    name: Generate Mochawesome Report

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs: cypress

    if: always()

    steps:

      # 1. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Install dependencies
      - name: Install dependencies
        run: npm install

      # 3. Download all Mochawesome reports
      - name: Download all Mochawesome reports
        uses: actions/download-artifact@v4
        with:
          pattern: mochawesome-*
          path: cypress/reports/jsons

      # 4. Merge Mochawesome JSON
      - name: Merge Mochawesome JSON
        run: |
          npx mochawesome-merge \
            "cypress/reports/jsons/**/mochawesome-*.json" \
            -o cypress/reports/mochawesome.json
          
          # Verify merged report was created
          if [ ! -f cypress/reports/mochawesome.json ]; then
            echo "❌ Error: Merged report file not created!"
            exit 1
          fi
          
          echo "✅ Report merge completed successfully"
          ls -lh cypress/reports/mochawesome.json

      # 5. Generate HTML report
      - name: Generate HTML report
        run: |
          npx marge \
            cypress/reports/mochawesome.json \
            -f index \
            -o cypress/reports/html

      # 6. Setup GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # 7. Upload report to GitHub Pages
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: cypress/reports/html

      # 8. Deploy report to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4