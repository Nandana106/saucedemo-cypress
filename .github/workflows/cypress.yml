name: Cypress Tests and Report

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ==========================================
  # PARALLEL CYPRESS TEST EXECUTION
  # ==========================================
  cypress:

    name: Cypress - ${{ matrix.name }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: authentication
            spec: cypress/e2e/authentication/**/*.cy.js

          - name: products
            spec: cypress/e2e/products/**/*.cy.js

          - name: cart
            spec: cypress/e2e/cart/**/*.cy.js

          - name: checkout
            spec: cypress/e2e/checkout/**/*.cy.js

          - name: footer
            spec: cypress/e2e/footer/**/*.cy.js
          
          - name: sidebar
            spec: "cypress/e2e/sidebar/**/*.cy.js"

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run Cypress tests
      - name: Run Cypress Tests
        continue-on-error: true
        run: npx cypress run \
            --browser chrome \
            --spec "${{ matrix.spec }}"
        env:
          CYPRESS_password: ${{ secrets.CYPRESS_PASSWORD }}

      # 5. Upload Mochawesome JSON
      - name: Upload Mochawesome JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-${{ matrix.name }}
          path: cypress/reports/.jsons/
          include-hidden-files: true
          if-no-files-found: warn

      # 6. Upload Cypress screenshots
      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.name }}
          path: cypress/screenshots/
          if-no-files-found: ignore

      # 7. Upload Cypress videos
      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ matrix.name }}
          path: cypress/videos/
          if-no-files-found: ignore


  # ==========================================
  # MERGE AND PUBLISH REPORT
  # ==========================================
  report:

    name: Generate Mochawesome Report

    runs-on: ubuntu-latest

    needs: cypress

    if: always()

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Download all Mochawesome reports
      - name: Download all Mochawesome reports
        uses: actions/download-artifact@v4
        with:
          pattern: mochawesome-*
          path: cypress/reports/jsons

      # 5. Show downloaded reports
      - name: Show downloaded reports
        run: find cypress/reports/jsons \
            -type f \
            -name "*.json" \
            -print
      # 6. Collect JSON reports
      - name: Collect JSON reports
        run: |
          mkdir -p cypress/reports/merged-json
          counter=0
          while IFS= read -r file; do
            counter=$((counter + 1))
            cp "$file" \
              "cypress/reports/merged-json/report_${counter}.json"
          done < <(
            find cypress/reports/jsons \
              -type f \
              -name "*.json"
          )
          find cypress/reports/merged-json \
            -type f \
            -name "*.json" \
            -print
      # 7. Merge Mochawesome JSON
      - name: Merge Mochawesome JSON
        run: |
          npx mochawesome-merge \
            "cypress/reports/merged-json/*.json" \
            -o cypress/reports/mochawesome.json
          if [ ! -f cypress/reports/mochawesome.json ]; then
            echo "❌ Error: Merged report not created"
            exit 1
          fi
          echo "✅ Merge successful"
      # 8. Generate HTML report
      - name: Generate HTML report
        run: |
          npx marge \
            cypress/reports/mochawesome.json \
            -f index \
            -o cypress/reports/html
      # 9. Verify generated HTML
      - name: Show generated HTML
        run: find cypress/reports/html \
            -type f \
            -print
      # 10. Configure GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # 11. Upload report to GitHub Pages
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: cypress/reports/html

      # 12. Deploy report to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4